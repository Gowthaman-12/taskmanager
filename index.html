<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Task Manager</h1>
        </div>

        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter a new task..." 
                autocomplete="off"
            >
            <button id="addBtn" class="btn btn-add">Add Task</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <p>Total: <span id="totalTasks">0</span> | Completed: <span id="completedTasks">0</span> | Pending: <span id="pendingTasks">0</span></p>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div id="emptyState" class="empty-state">
            <p>No tasks yet. Add one to get started! 🚀</p>
        </div>

        <button id="clearBtn" class="btn btn-clear">Clear Completed Tasks</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
